name: Build TrustNoOne (horror)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # Find the actual Gradle project, whether repository files are at root
      # or the project has accidentally been uploaded inside a subdirectory.
      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          if [[ -f "build.gradle" && -f "settings.gradle" ]]; then
            PROJECT_DIR="."
          elif [[ -f "TrustNoOne-Fabric-1.21.11/build.gradle" && -f "TrustNoOne-Fabric-1.21.11/settings.gradle" ]]; then
            PROJECT_DIR="TrustNoOne-Fabric-1.21.11"
          elif [[ -f "TrustNoOne/build.gradle" && -f "TrustNoOne/settings.gradle" ]]; then
            PROJECT_DIR="TrustNoOne"
          else
            while IFS= read -r build_file; do
              candidate="${build_file%/build.gradle}"
              if [[ -f "$candidate/settings.gradle" || -f "$candidate/settings.gradle.kts" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find . -mindepth 2 -maxdepth 6 -type f -name build.gradle \
              -not -path '*/build/*' -not -path '*/.gradle/*' | sort)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find a Gradle project (build.gradle + settings.gradle)."
            echo "Repository root contents:"
            ls -la
            echo "Potential Gradle files:"
            find . -maxdepth 6 \( -name build.gradle -o -name settings.gradle \) -print
            exit 1
          fi

          echo "Detected Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Fabric mod
        shell: bash
        run: gradle --no-daemon -p "${{ steps.locate.outputs.project_dir }}" clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrustNoOne-Fabric-1.21.11
          path: |
            **/build/libs/TrustNoOne-*.jar
            !**/build/libs/*-dev.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
